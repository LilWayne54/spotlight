<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#221e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stoplight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Stoplight</title>
<style>
:root{
  --bar:#221e1a; --bar2:#2b2621; --desk:#35302a; --cream:#f4ecdf; --dim:rgba(244,236,223,.62); --faint:rgba(244,236,223,.36);
  --paper:#fbf7ee; --ink:#26221d;
  --R:#e5534b; --Y:#f2c230; --G:#4cbb5e;
  --hr:#f0a9a3; --hy:#f9e19a; --hg:#b9e0a3;
  --spring:cubic-bezier(.3,1.6,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
  --font:Georgia, serif; --size:13pt; --line:1.5;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bar);overscroll-behavior:none}
body{color:var(--cream);font:14px/1.4 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%}
#app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;background:var(--desk)}
button{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation}
select,input{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--Y);outline-offset:2px;border-radius:8px}

/* header */
.top{flex:none;padding:calc(var(--st) + 4px) 8px 0;background:linear-gradient(var(--bar2),var(--bar));box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:5}
.row1{display:flex;align-items:center;gap:2px;height:44px}
.ib{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--dim);transition:background .15s,color .15s,scale .25s var(--spring)}
.ib:active{scale:.86;background:rgba(255,255,255,.1)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--cream)}
.ib.txt{font-weight:700;font-size:16px;font-family:Georgia,serif}
.title{flex:1;min-width:0;padding:6px 8px;border-radius:10px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title:active{background:rgba(255,255,255,.08)}
.saved{flex:none;font-size:11px;color:var(--faint);margin-right:2px}
.row2{display:flex;align-items:center;gap:8px;height:58px}
.housing{flex:none;display:flex;gap:8px;padding:6px 9px;border-radius:99px;background:#15120f;box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}
.lamp{position:relative;width:36px;height:36px;border-radius:50%;transition:scale .3s var(--spring),box-shadow .25s}
.lamp::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 42%),var(--lc);opacity:.26;transition:opacity .2s}
.lamp:active{scale:.84}
.lamp.r{--lc:var(--R)} .lamp.y{--lc:var(--Y)} .lamp.g{--lc:var(--G)}
.lamp[aria-pressed="true"]{scale:1.08;box-shadow:0 0 14px 2px var(--lc),0 0 0 2px rgba(255,255,255,.12)}
.lamp[aria-pressed="true"]::before{opacity:1}
.lamp.pulse{animation:pulse .5s var(--spring)}
@keyframes pulse{0%{scale:.8}60%{scale:1.18}}
.nolamp{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--faint);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);transition:scale .25s var(--spring)}
.nolamp:active{scale:.84}
.nolamp[aria-pressed="true"]{color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--cream)}
.nolamp svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.modecap{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;overflow:hidden}
.modecap b{font-size:13.5px;white-space:nowrap}
.modecap span{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-mode="r"] .modecap b{color:#ff8a82} body[data-mode="y"] .modecap b{color:#ffd65c} body[data-mode="g"] .modecap b{color:#7fd88b}
.fmt{flex:none;display:flex}
.fmt .ib{width:34px}
.tally{display:flex;height:3px;margin:0 -8px;background:rgba(255,255,255,.06)}
.tally i{height:100%;transition:width .4s var(--ease)}
.tally .tr{background:var(--R)} .tally .ty{background:var(--Y)} .tally .tg{background:var(--G)}
@media (max-width:370px){.modecap{display:none}.lamp{width:32px;height:32px}}

/* desk & page */
.desk{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(ellipse at 50% 0%,#403931,var(--desk) 60%)}
.page{position:relative;width:min(780px,calc(100% - 20px));margin:12px auto 50vh;padding:30px 24px 60px;min-height:calc(100% - 24px);background:var(--paper);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 40px -12px rgba(0,0,0,.55);cursor:text}
@media (min-width:700px){.page{padding:68px 76px 110px;margin-top:30px}}
.doc{color:var(--ink);font-family:var(--font);font-size:var(--size);line-height:var(--line)}
#ed{outline:none;caret-color:var(--ink);user-select:text;-webkit-user-select:text;min-height:200px}
.doc p{margin:0;white-space:pre-wrap;overflow-wrap:break-word}
.indent .doc p{text-indent:2.2em} .indent .doc p.cont{text-indent:0}
.doc .c-r{background:var(--hr)} .doc .c-y{background:var(--hy)} .doc .c-g{background:var(--hg)}
.doc span{-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:2px}
.doc .b{font-weight:700} .doc .i{font-style:italic} .doc .u{text-decoration:underline;text-underline-offset:.15em}
.plain .doc .c-r,.plain .doc .c-y,.plain .doc .c-g{background:none}
body[data-mode="r"] #ed{caret-color:#d23a31} body[data-mode="y"] #ed{caret-color:#c89600} body[data-mode="g"] #ed{caret-color:#2f9a42}
.dropcap #ed>p:first-child,.dropcap .doc p.first{text-indent:0}
.dropcap #ed>p:first-child::first-letter,.dropcap .doc p.first::first-letter{float:left;font-size:3.35em;line-height:.8;margin:.07em .09em 0 0;font-weight:600}
.ph{position:absolute;left:24px;top:30px;right:24px;font-family:var(--font);font-size:var(--size);line-height:var(--line);color:#b8ad9c;pointer-events:none;font-style:italic}
@media (min-width:700px){.ph{left:76px;top:68px;right:76px}}
.indent .ph{text-indent:2.2em}
.paged .page{width:816px;max-width:none;padding:96px;margin:16px auto 50vh;border-radius:0;box-shadow:none;min-height:1056px;
  background:repeating-linear-gradient(to bottom,var(--paper) 0,var(--paper) 1056px,transparent 1056px,transparent 1084px)}
.paged #ed{width:624px;min-height:864px}
.paged .ph{left:96px;top:96px;right:96px}
.paged .page::after{content:attr(data-last);position:absolute;left:0;right:0;bottom:46px;text-align:center;font:11px system-ui,sans-serif;color:#b8ad9c}
.pgbrk{display:block;position:relative;user-select:none;-webkit-user-select:none;pointer-events:none;text-indent:0}
.pgbrk::after{content:attr(data-n);position:absolute;left:0;right:0;top:calc(var(--fill) + 46px);text-align:center;font:11px system-ui,sans-serif;color:#b8ad9c;font-style:normal;font-weight:400}
.foot{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;height:26px;padding:0 12px;background:var(--bar);color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.foot .pg{color:var(--cream);font-weight:600}
.foot .pg:empty{display:none}
.pageinfo-old{position:fixed;z-index:6;left:50%;bottom:calc(var(--sb) + 16px);translate:-50% 0;padding:7px 14px;border-radius:99px;background:rgba(20,17,14,.85);color:var(--cream);font-size:12.5px;font-weight:600;pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pageinfo:empty{display:none}

/* sheets (Aa + docs) */
.veil{position:fixed;inset:0;z-index:20;background:rgba(10,8,6,.45);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheetpanel{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;padding:10px 18px calc(var(--sb) + 18px);border-radius:20px 20px 0 0;background:#2d2823;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .25s var(--ease)}
@keyframes up{from{translate:0 100%}}
@media (min-width:700px){.sheetpanel{left:auto;right:14px;bottom:auto;top:calc(var(--st) + 54px);width:330px;border-radius:16px;animation:fade .15s}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.sheetpanel h4{margin:6px 0 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sheetpanel .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;min-height:34px}
.sheetpanel select{flex:1;padding:9px 10px;border-radius:10px;border:0;outline:none;background:rgba(255,255,255,.08);color:var(--cream);-webkit-appearance:none;appearance:none}
.sheetpanel select option{background:#2d2823}
.seg{display:flex;flex-wrap:wrap;width:100%;padding:3px;border-radius:12px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.seg button{flex:1 0 auto;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .18s,color .18s,scale .25s var(--spring)}
.seg button:active{scale:.94}
.seg button[aria-pressed="true"]{background:var(--cream);color:#2a241e}
.seg .pips{display:flex;gap:2px}
.seg .pips i{width:6px;height:6px;border-radius:50%}
.stepper{display:flex;align-items:center;gap:4px;padding:3px;border-radius:10px;background:rgba(255,255,255,.07)}
.stepper button{width:32px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:18px;color:var(--dim)}
.stepper button:active{background:rgba(255,255,255,.12)}
.stepper span{min-width:44px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.meaning{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.meaning{align-items:flex-start}
.meaning i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:10px}
.meaning textarea{resize:none;overflow:hidden;font:inherit;line-height:1.35;field-sizing:content;flex:1;min-width:0;padding:8px 10px;border:0;outline:none;border-radius:9px;background:rgba(255,255,255,.08);color:var(--cream);user-select:text;-webkit-user-select:text}
.meaning textarea::placeholder{color:var(--faint)}
.meaning textarea:focus{background:rgba(255,255,255,.13)}
.linkbtn{font-size:12px;color:var(--dim);padding:4px 8px;border-radius:8px}
.linkbtn:hover{background:rgba(255,255,255,.08);color:var(--cream)}
.doc span[class*=" k-"]{box-shadow:inset 0 -2px 0 rgba(124,92,214,.75)}
.cmbtn{position:relative}
.cmbtn .badge{position:absolute;top:3px;right:2px;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:#7c5cd6;color:#fff;font:700 9.5px/15px system-ui,sans-serif;text-align:center}
.cmbtn .badge:empty{display:none}
.cards{display:flex;flex-direction:column;gap:8px}
.card{padding:10px 10px 8px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:background .15s,box-shadow .15s}
.card.on{background:rgba(124,92,214,.16);box-shadow:inset 0 0 0 1.5px rgba(124,92,214,.7)}
.card .q{display:block;width:100%;margin-bottom:6px;padding-left:8px;border-left:2px solid #7c5cd6;font-size:12px;color:var(--dim);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.card .q.gone{border-left-color:rgba(255,255,255,.2)}
.card textarea{display:block;width:100%;resize:none;overflow:hidden;border:0;outline:none;background:transparent;color:var(--cream);font:inherit;font-size:13.5px;line-height:1.4;padding:2px 0;user-select:text;-webkit-user-select:text;field-sizing:content;min-height:22px}
.card textarea::placeholder{color:var(--faint)}
.card .meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--faint)}
.card .x{padding:3px 8px;border-radius:7px;font-size:11.5px;color:var(--faint)}
.card .x:hover,.card .x:active{background:rgba(255,120,100,.14);color:#ff9a8a}
.cmempty{padding:14px 4px;color:var(--faint);font-size:12.5px;line-height:1.5}
.cmadd{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;margin-bottom:10px;border-radius:11px;background:#7c5cd6;color:#fff;font-weight:600;transition:scale .2s var(--spring)}
.cmadd:active{scale:.96}
.seg .pips i.pn{background:transparent !important;box-shadow:inset 0 0 0 1.3px currentColor}
.seg button{white-space:nowrap}
.seg .plus{padding:6px 9px;color:var(--faint);font-size:15px;line-height:1}
.patrow{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.05)}
.patrow .pips{display:flex;gap:3px;flex:none}
.patrow .pips i{width:8px;height:8px;border-radius:50%}
.patrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seqview{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-height:44px;padding:10px;margin:0 0 10px;border-radius:12px;background:rgba(0,0,0,.28)}
.seqview .sqd{display:block;flex:none;width:24px;height:24px;border-radius:50%;transition:scale .2s var(--spring)}
.seqview .sqd:active{scale:.85}
.seqview .arrow{color:var(--faint);font-size:11px}
.seqview .empty{color:var(--faint);font-size:12.5px}
.adders{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.adders button.add{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:scale .2s var(--spring)}
.adders button.add:active{scale:.85}
.adders .back{margin-left:auto;padding:7px 10px;border-radius:9px;font-size:12.5px;color:var(--dim);background:rgba(255,255,255,.07)}
.pn-dot{background:transparent !important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45) !important}
.modal .lbl2{display:block;margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.modal input.pname{display:block;width:100%;margin:0 0 14px;padding:9px 11px;border:0;outline:none;border-radius:10px;background:rgba(255,255,255,.09);color:var(--cream);font-size:15px;user-select:text;-webkit-user-select:text}
.modal .tiny{margin:-2px 0 14px;font-size:12px;color:var(--faint)}
.modal .btns .del{margin-right:auto;background:transparent;color:#ff9a8a}
.toggle{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:translate .25s var(--spring)}
.toggle[aria-checked="true"]{background:var(--G)}
.toggle[aria-checked="true"]::after{translate:18px 0}
.hint{font-size:12px;color:var(--faint);margin:-4px 0 12px}
.bigbtn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:600;transition:scale .2s var(--spring)}
.bigbtn:active{scale:.97;background:rgba(255,255,255,.12)}
.bigbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.doclist{list-style:none;margin:6px 0 0;padding:0}
.doclist li{display:flex;align-items:center;gap:6px;border-radius:12px}
.doclist li.on{background:rgba(255,255,255,.06)}
.doclist .open{flex:1;min-width:0;padding:11px 10px}
.doclist .open b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doclist .open small{display:block;color:var(--faint);font-size:11.5px;margin-top:1px}
.doclist .del{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--faint)}
.doclist .del:active{background:rgba(255,120,100,.16);color:#ff9a8a}
.doclist .del svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* modal & toast */
.mveil{position:fixed;inset:0;z-index:30;background:rgba(10,8,6,.5);display:grid;place-items:center;animation:fade .15s}
.modal{width:min(360px,calc(100% - 40px));padding:20px;border-radius:18px;background:#2d2823;box-shadow:0 24px 50px -10px rgba(0,0,0,.7);animation:pop .2s var(--spring)}
@keyframes pop{from{scale:.94;opacity:0}}
.modal p{margin:0 0 14px;font-size:15px;line-height:1.45}
.modal input{display:block;width:100%;margin:0 0 14px;padding:10px 12px;border:0;outline:none;border-radius:10px;background:rgba(255,255,255,.09);font-size:16px;-webkit-user-select:text;user-select:text}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal button{padding:10px 15px;border-radius:11px;font-weight:600;background:rgba(255,255,255,.08);transition:scale .2s var(--spring)}
.modal button:active{scale:.93}
.modal button.main{background:var(--cream);color:#2a241e}
.modal button.danger{background:#e5534b;color:#fff}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(var(--sb) + 60px);translate:-50% 0;padding:10px 16px;border-radius:99px;background:var(--cream);color:#2a241e;font-weight:600;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s,translate .3s var(--spring);max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;translate:-50% -6px}
.toast.err{background:#ffb4ab;color:#3a1410}
</style>
</head>
<body data-mode="r">
<div id="app">
<header class="top">
  <div class="row1">
    <button class="ib" id="bDocs" title="Documents"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h9"/></svg></button>
    <button class="title" id="title" title="Rename">Untitled</button>
    <span class="saved" id="saved"></span>
    <button class="ib cmbtn" id="bCm" title="Comments"><svg viewBox="0 0 20 20"><path d="M3.5 4.5h13v9h-7l-4 3v-3h-2z"/></svg><span class="badge" id="cmBadge"></span></button>
    <button class="ib" id="bPages" title="Pages view" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M6.5 2.5h9v12h-9z M3.5 5.5v12h9"/></svg></button>
    <button class="ib" id="bEye" title="Show or hide colors" aria-pressed="true"><svg viewBox="0 0 20 20"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10z"/><circle cx="10" cy="10" r="2.6"/></svg></button>
    <button class="ib txt" id="bAa" title="Settings" style="font-weight:600">Aa</button>
    <button class="ib" id="bShare" title="Export .docx"><svg viewBox="0 0 20 20"><path d="M10 13V2.5 M6.5 6 10 2.5 13.5 6 M5 9H4v8.5h12V9h-1"/></svg></button>
  </div>
  <div class="row2">
    <div class="housing">
      <button class="lamp r" data-c="r" title="Red: not trying, no bashing"></button>
      <button class="lamp y" data-c="y" title="Yellow: trying, no bashing"></button>
      <button class="lamp g" data-c="g" title="Green: trying, bashing"></button>
    </div>
    <button class="nolamp" data-c="n" title="No color"><svg viewBox="0 0 14 14"><path d="M3 11L11 3"/></svg></button>
    <div class="modecap"><b id="mName">Red</b><span id="mDesc">not trying · no bashing</span><span id="next"></span></div>
    <div class="fmt">
      <button class="ib txt" id="bB" title="Bold">B</button>
      <button class="ib txt" id="bI" title="Italic" style="font-style:italic">I</button>
      <button class="ib txt" id="bU" title="Underline" style="text-decoration:underline">U</button>
    </div>
  </div>
  <div class="tally" id="tally"><i class="tr"></i><i class="ty"></i><i class="tg"></i></div>
</header>
<main class="desk" id="desk">

  m.querySelector('.cancel').onclick = close;
  m.querySelector('.ok').onclick = () => {
    if (seq.length < 2) { toast('Add at least two colors', true); return; }
    const nm = name.value.trim() || 'Pattern ' + (list.length + (ex ? 0 : 1));
    let pid = id;
    if (ex) { ex.name = nm; ex.seq = seq; } else { pid = 'p' + Math.random().toString(36).slice(2, 8); list.push({ id: pid, name: nm, seq }); }
    close(); renderPatList(); choosePattern(pid);
  };
  if (ex) m.querySelector('.del').onclick = () => {
    const i = list.indexOf(ex); if (i >= 0) list.splice(i, 1);
    close(); renderPatList();
    if (settings.pattern === id) choosePattern('free'); else { saveSettings(); renderSeg(); }
  };
  if (!ex) setTimeout(() => name.focus(), 40);
}
$('seg').addEventListener('mousedown', e => e.preventDefault());
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p === '+') editPattern(null); else choosePattern(b.dataset.p);
});
$('seg').addEventListener('contextmenu', e => {
  const b = e.target.closest('button'); if (!b || !(settings.customPatterns || []).some(p => p.id === b.dataset.p)) return;
  e.preventDefault(); editPattern(b.dataset.p);
});
$('patNew').onclick = () => editPattern(null);

/* ---------- wiring ---------- */
function openComments(focusId) { closePop(); closeDocs(); $('cmPanel').hidden = false; $('veilCm').hidden = false; renderComments(focusId); }
function closeComments() { $('cmPanel').hidden = true; $('veilCm').hidden = true; }
$('veilCm').onclick = () => closeComments();
tap($('bCm'), () => {
  const s = getSel(), inEd = document.activeElement === ed;
  if (inEd && s && !collapsed(s)) { addComment(); return; }
  const id = inEd ? cmAtCaret() : null;
  openComments(id || undefined);
  if (id) { setActiveCm(id); }
});
tap($('cmAdd'), () => { const s = getSel(); if (!s) { closeComments(); toast('Select some text first, then tap 💬'); return; } addComment(); });
function tap(el, fn) {
  el.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false });
  el.addEventListener('mousedown', e => e.preventDefault());
  el.addEventListener('click', fn);
}
for (const b of document.querySelectorAll('[data-c]')) tap(b, () => { if (document.activeElement !== ed && !pagesOn) ed.focus(); setMode(b.dataset.c, { click: true }); });
for (const [id, k] of [['bB', 'b'], ['bI', 'i'], ['bU', 'u']]) tap($(id), () => toggleFmt(k));
tap($('bEye'), () => { settings.colors = !settings.colors; saveSettings(); applySettings(); blip('n', true); });
tap($('bPages'), () => togglePages());

$('bAa').onclick = () => { const open = $('pop').hidden; closeDocs(); $('pop').hidden = !open; $('veilPop').hidden = !open; $('bAa').setAttribute('aria-pressed', open); for (const id of ['dR', 'dY', 'dG']) grow($(id)); };
$('veilPop').onclick = () => closePop();
$('bDocs').onclick = () => { closePop(); openDocs(); };
$('veilDocs').onclick = () => closeDocs();
$('bNewDoc').onclick = () => newDoc();
$('bImport').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; importFile(f); };
$('title').onclick = async () => {
  const d = entry(currentId); if (!d) return;
  const t = await askText('Name this document', docTitle(d));
  if (t == null) return;
  const list = idx(), x = list.find(y => y.id === currentId);
  if (t) { x.title = t; x.named = true; } else { x.named = false; x.title = firstWords(); }
  LS.set('sl.index', list); titleUI();
};
$('bShare').onclick = async () => {
  const a = await ask('Export this document as a Word file (.docx)', [['cancel', 'Cancel'], ['clean', 'Without colors'], ['colors', 'With colors', true]]);
  if (a === 'colors') exportDocx(true); else if (a === 'clean') exportDocx(false);
};
for (const f of FONTS) { const o = document.createElement('option'); o.value = f; o.textContent = f; o.style.fontFamily = `"${f}"`; $('sFont').appendChild(o); }
$('sFont').onchange = e => { settings.font = e.target.value; saveSettings(); applySettings(); };
$('szDn').onclick = () => { settings.size = Math.max(9, settings.size - 1); saveSettings(); applySettings(); };
$('szUp').onclick = () => { settings.size = Math.min(28, settings.size + 1); saveSettings(); applySettings(); };
const LINES = [1, 1.15, 1.5, 2];
$('lnDn').onclick = () => { const i = LINES.indexOf(settings.line); settings.line = LINES[Math.max(0, (i < 0 ? 2 : i) - 1)]; saveSettings(); applySettings(); };
$('lnUp').onclick = () => { const i = LINES.indexOf(settings.line); settings.line = LINES[Math.min(LINES.length - 1, (i < 0 ? 2 : i) + 1)]; saveSettings(); applySettings(); };
$('zDn').onclick = () => setZoom((settings.zoom || 1) / 1.1);
$('zUp').onclick = () => setZoom((settings.zoom || 1) * 1.1);
for (const [id, c] of [['dR', 'r'], ['dY', 'y'], ['dG', 'g']]) {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  $(id).addEventListener('input', e => { grow(e.target); settings.desc = Object.assign({}, settings.desc, { [c]: e.target.value }); saveSettings(); updateModeUI(false); });
}
$('dReset').onclick = () => { settings.desc = {}; saveSettings(); for (const id of ['dR', 'dY', 'dG']) { $(id).value = ''; grow($(id)); } updateModeUI(false); };
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function fillDesc() { const d = settings.desc || {}; $('dR').value = d.r || ''; $('dY').value = d.y || ''; $('dG').value = d.g || ''; for (const id of ['dR', 'dY', 'dG']) requestAnimationFrame(() => grow($(id))); }
for (const [id, k] of [['tIndent', 'indent'], ['tDrop', 'dropcap'], ['tSound', 'sound']]) $(id).onclick = () => { settings[k] = !settings[k]; saveSettings(); applySettings(); if (k === 'sound') blip('g', false); };

/* pinch to zoom */
let pinch = null;
$('desk').addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: settings.zoom || 1 };
  }
}, { passive: true });
$('desk').addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const [a, b] = e.touches, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  setZoom(pinch.z * d / pinch.d, (a.clientY + b.clientY) / 2);
}, { passive: false });
$('desk').addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
document.addEventListener('gesturestart', e => e.preventDefault());

/* keyboard shortcuts (iPad / desktop keyboards) */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, inEd = document.activeElement === ed || document.activeElement === document.body;
  if (document.querySelector('.mveil')) return;
  if (!mod) {
    if (e.key === 'Tab' && document.activeElement === ed) { e.preventDefault(); pushUndo('type', true); insertText('\t'); changed(); }
    else if (e.key === 'Escape') { closePop(); closeDocs(); closeComments(); }
    return;
  }
  const k = e.key.toLowerCase(), code = e.code, hit = fn => { e.preventDefault(); fn(); };
  if (!e.shiftKey && !e.altKey && code === 'Digit1') return hit(() => setMode('r', { click: true }));
  if (!e.shiftKey && !e.altKey && code === 'Digit2') return hit(() => setMode('y', { click: true }));
  if (!e.shiftKey && !e.altKey && code === 'Digit3') return hit(() => setMode('g', { click: true }));
  if (!e.shiftKey && !e.altKey && code === 'Digit0') return hit(() => setMode('n', { click: true }));
  if (!e.shiftKey && k === 'b') return hit(() => toggleFmt('b'));
  if (!e.shiftKey && k === 'i') return hit(() => toggleFmt('i'));
  if (!e.shiftKey && k === 'u') return hit(() => toggleFmt('u'));
  if (k === 'z' && inEd) return hit(() => e.shiftKey ? redo() : undo());
  if (k === 'y' && inEd) return hit(redo);
  if (k === 's') return hit(() => { saveCurrent(); });
  if (k === 'o') return hit(() => $('fileIn').click());
  if (e.shiftKey && k === 'p') return hit(() => togglePages());
  if (e.altKey && k === 'm') return hit(addComment);
  if (e.shiftKey && k === 'h') return hit(() => { settings.colors = !settings.colors; saveSettings(); applySettings(); });
}, true);

/* keep the app sized to the visible area when the keyboard opens */
function fitViewport() {
  const vv = window.visualViewport; if (!vv) return;
  $('app').style.height = vv.height + 'px';
  $('app').style.top = vv.offsetTop + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty) saveCurrent(true); });
addEventListener('pagehide', () => { if (dirty) saveCurrent(true); });

/* ---------- boot ---------- */
(() => {
  settings = Object.assign(settings, LS.get('sl.settings', {}));
  if (!LINES.includes(settings.line)) settings.line = 1.5;
  if (!Array.isArray(settings.customPatterns)) settings.customPatterns = [];
  if (!(settings.pattern === 'free' || patSeq(settings.pattern))) settings.pattern = 'free';
  renderSeg(); renderPatList();
  if (!(settings.zoom >= 0.5 && settings.zoom <= 3)) settings.zoom = 1;
  if (!FONTS.includes(settings.font)) settings.font = 'Georgia';
  mode = ['r', 'y', 'g', 'n'].includes(settings.mode) ? settings.mode : 'r';
  if (!settings.desc || typeof settings.desc !== 'object') settings.desc = {};
  fillDesc();
  applySettings(); applyZoom();
  const list = idx(); let cur = LS.get('sl.current', null);
  if (!list.find(d => d.id === cur)) cur = list.length ? list[0].id : createDoc('');
  openDoc(cur, false);
  updateModeUI(false); updateFmtUI(); fitViewport();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
